<html>

<head>
    <script src="./simpleflow.webgpu.js"></script>
</head>

<body>
    <input type="file" id="modelImport" />

    <script type="module">
        import { Xdata, Ydata } from './data.js';

        // -- utility for clipping as before
        function clip(x, min, max) {
            return Math.max(min, Math.min(max, x));
        }

        // -- normalization helpers
        function computeMinMax(data) {
            // data: array of arrays, all same length
            const dims = data[0].length;
            const min = Array(dims).fill(Infinity);
            const max = Array(dims).fill(-Infinity);
            for (const row of data) {
                row.forEach((v, i) => {
                    if (v < min[i]) min[i] = v;
                    if (v > max[i]) max[i] = v;
                });
            }
            return { min, max };
        }

        function normalizeRow(row, min, max) {
            return row.map((v, i) =>
                // avoid division by zero if max==min
                max[i] === min[i] ? 0 : (v - min[i]) / (max[i] - min[i])
            );
        }

        function denormalizeValue(yNorm, min, max) {
            return yNorm * (max - min) + min;
        }

        function formatTarget(row) {
            return Array.isArray(row) ? row[0] : row;
        }

        async function logPredictions(model, rows, targets, xMin, xMax, yMin, yMax, label) {
            console.log(label);

            let index = 0;
            for (const rawRow of rows) {
                const normRow = normalizeRow(rawRow, xMin, xMax);
                const predNorm = (await model.predictGPU(normRow))[0];
                const pred = denormalizeValue(predNorm, yMin, yMax);
                const expected = formatTarget(targets[index]);
                const diff = Math.abs(expected - pred);

                console.log(rawRow, '→', `${pred.toFixed(4)} diff: ${diff.toFixed(4)}`);
                index++;
            }
        }


        document.getElementById('modelImport').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (file) {
                await FlexibleNN.importModelFromFile(file, 'my-multivariate-model');
                alert('Model imported!');

                const loadedModel = await FlexibleNN.loadModel("my-multivariate-model");
                const gpuReady = await loadedModel.initializeGPU();
                console.log('Imported model GPU status:', loadedModel.getGPUStatus(), 'ready:', gpuReady);
                await logPredictions(loadedModel, X, Y, Xmin, Xmax, Ymin, Ymax, 'Imported model predictions (GPU inference when available):');
            }
        });

        // --- your raw data: ---
        const X = Xdata;
        const Y = Ydata;

        // compute min/max for each column
        const { min: Xmin, max: Xmax } = computeMinMax(X);
        const { min: YminArr, max: YmaxArr } = computeMinMax(Y);
        // since Y is 1-D target, grab scalars
        const Ymin = YminArr[0], Ymax = YmaxArr[0];

        // normalize data into [0,1]
        const Xnorm = X.map(row => normalizeRow(row, Xmin, Xmax));
        const Ynorm = Y.map(row => [normalizeRow(row, YminArr, YmaxArr)[0]]);

        // build, train, and save your model on normalized data:
        let builder = new FlexibleNNBuilder();

        let model = await builder
            .withLayerSizes([3, 32, 32, 32, 1])
            .withLearningRate(0.01)
            .withActivation('clippedRelu', 1)
            .withTrainingExecution('auto')
            .buildGPU();

        console.log('Training model GPU status:', model.getGPUStatus());
        console.log('Training mode: auto uses CPU-forward training to avoid GPU readback stalls, then uses GPU for inference.');

        const trainStart = performance.now();
        await model.trainGPU(Xnorm, Ynorm, 1000, { execution: 'auto', logEvery: 100 });
        const trainMs = performance.now() - trainStart;
        console.log(`Training time: ${trainMs.toFixed(2)}ms`);

        await model.saveModel("my-multivariate-model");
        await FlexibleNN.exportModelToBinFile({ key: 'my-multivariate-model', quantized: false });

        await logPredictions(model, X, Y, Xmin, Xmax, Ymin, Ymax, 'Training data predictions (GPU inference when available):');
    </script>
</body>

</html>
